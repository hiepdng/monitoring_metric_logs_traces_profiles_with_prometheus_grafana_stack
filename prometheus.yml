global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ["node_exporter:9100"]
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
  - job_name: 'tempo'
    static_configs:
      - targets: [ 'tempo:3200' ]
  - job_name: 'loki'
    static_configs:
      - targets: [ 'lokio:3100' ]
