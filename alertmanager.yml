global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'your-address@gmail.com'
  smtp_auth_username: 'your-address@gmail.com'
  smtp_auth_password: 'your-16-character-app-password'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'gmail-alerts'

receivers:
  - name: 'gmail-alerts'
    email_configs:
      - to: 'your-address@gmail.com'
        send_resolved: true
